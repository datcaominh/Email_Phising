[project]
name = "hybrid-phishing-analyzer"
version = "0.1.0"
description = "Hybrid multi-agent phishing email analyzer with Streamlit, Random Forest and LLM analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Cao Minh Đạt" }
]
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=2.0.0"
]

[tool.setuptools]
packages = ["app"]

[tool.poetry]
authors = ["Cao Minh Đạt"]
